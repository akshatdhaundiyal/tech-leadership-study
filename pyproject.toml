[project]
name = "tech-leadership-study"
version = "0.1.0"
description = "Self-Study Mentorship Engine: Technical Product Management & Engineering Leadership"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "lancedb>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
